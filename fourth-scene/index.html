<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Torre e árvore detalhada, lago e vídeo de câmera em arco." />
    <title>Dimension Explorer — Filme da torre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body>
    <main>
      <canvas id="world" aria-label="Cena 3D interativa da torre, árvore e lago"></canvas>
      <section class="panel" aria-live="polite">
        <details open>
          <summary>
            <span class="titles"><a class="brand" href="../index.html">← Dimension Explorer</a><h1>Filme da torre</h1></span>
            <span class="toggle" aria-hidden="true"></span>
          </summary>
          <div class="panel-body">
          <nav class="scene-picker" aria-label="Selecionar projeto">
            <div class="group">
              <span class="scene-label">Cenas</span>
              <div class="chips">
              <a href="../dist/index.html">Torre</a>
              <a href="../next-scene/index.html">Árvore</a>
              <a href="../third-scene/index.html">Lago</a>
              <a href="index.html" aria-current="page">Filme</a>
              </div>
            </div>
            <!-- fanart:start -->
            <div class="group">
              <span class="scene-label">Gengar</span>
              <div class="chips">
              <a href="../picachu/index.html">Picachu</a>
              <a href="../pikachu/index.html">Pikachu</a>
              </div>
            </div>
            <!-- fanart:end -->
          </nav>
            <div class="group">
              <span class="scene-label">Vista</span>
              <div class="controls">
                <button id="reset" type="button">Restaurar</button>
                <button id="front" type="button">Frontal</button>
                <button id="top" type="button">Superior</button>
              </div>
            </div>
          <a class="video-link" href="orbit.mp4" target="_blank" rel="noopener">Assistir ao vídeo da torre ↗</a>
            <p class="hint"><kbd>arrastar</kbd> gira · <kbd>roda</kbd> aproxima · <kbd>botão direito</kbd> move o foco</p>
            <p id="status">Carregando cena…</p>
          </div>
        </details>
      </section>
    </main>
    <script src="scene-data.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
