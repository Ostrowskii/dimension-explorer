<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Torre e árvore detalhada, lago e vídeo de câmera em arco." />
    <title>Dimension Explorer — Filme da torre</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <canvas id="world" aria-label="Cena 3D interativa da torre, árvore e lago"></canvas>
      <section class="panel" aria-live="polite">
        <p class="eyebrow">DIMENSION EXPLORER</p>
        <h1>Filme da torre</h1>
        <nav class="scene-picker" aria-label="Selecionar projeto">
          <span class="scene-label">Projetos</span>
          <a href="../dist/index.html">Torre</a>
          <a href="../next-scene/index.html">Árvore</a>
          <a href="../third-scene/index.html">Lago</a>
          <a href="index.html" aria-current="page">Filme</a>
          <a href="../gengar/index.html">Gengar</a>
          <a href="../pikachu/index.html">Pikachu</a>
        </nav>
        <p class="hint">Arraste para girar · Roda do mouse para aproximar · Botão direito para mover o foco</p>
        <div class="controls">
          <button id="reset" type="button">Restaurar visão</button>
          <button id="front" type="button">Vista frontal</button>
          <button id="top" type="button">Vista superior</button>
        </div>
        <a class="video-link" href="orbit.mp4" target="_blank" rel="noopener">Assistir ao vídeo da torre ↗</a>
        <p id="status">Carregando cena…</p>
      </section>
    </main>
    <script src="scene-data.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
