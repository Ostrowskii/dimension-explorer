<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Picachu: Gengar esculpido em splats gaussianos pixel-art." />
    <title>Dimension Explorer — Picachu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body class="de ghost">
    <main>
      <canvas id="world" aria-label="Cena 3D interativa do Gengar"></canvas>
      <header class="de-bar">
        <button class="de-exit" id="de-exit" type="button"><span class="arrow" aria-hidden="true">←</span> Sair do Dimension Explorer <kbd>Esc</kbd></button>
        <h1>Picachu</h1>
      </header>
      <div class="de-enter" id="de-enter" aria-hidden="true"><span class="de-badge">◈ Dimension Explorer</span><strong>Picachu</strong><span class="de-load">Entrando…</span></div>
      <section class="panel" aria-live="polite">
        <details open>
          <summary>
            <span class="summary-label">Controles</span>
            <span class="toggle" aria-hidden="true"></span>
          </summary>
          <div class="panel-body">
          <nav class="scene-picker" aria-label="Selecionar projeto">
            <div class="group">
              <span class="scene-label">Cenas</span>
              <div class="chips">
              <a href="../dist/index.html">Torre</a>
              <a href="../next-scene/index.html">Árvore</a>
              <a href="../third-scene/index.html">Lago</a>
              <a href="../fourth-scene/index.html">Filme</a>
              </div>
            </div>
            <!-- fanart:start -->
            <div class="group">
              <span class="scene-label">Gengar</span>
              <div class="chips">
              <a href="index.html" aria-current="page">Picachu</a>
              <a href="../pikachu/index.html">Pikachu</a>
              </div>
            </div>
            <div class="group">
              <span class="scene-label">Pikachu</span>
              <div class="chips">
              <a href="../pikachu-de-verdade/index.html">Pikachu ⚡</a>
              </div>
            </div>
            <!-- fanart:end -->
          </nav>
            <div class="group">
              <span class="scene-label">Vista</span>
              <div class="controls">
                <button id="reset" type="button">Restaurar</button>
                <button id="front" type="button">Frontal</button>
                <button id="top" type="button">Superior</button>
              </div>
            </div>
            <p class="hint"><kbd>arrastar</kbd> gira · <kbd>roda</kbd> aproxima · <kbd>botão direito</kbd> move o foco</p>
            <p id="status">Carregando cena…</p>
          </div>
        </details>
      </section>
    </main>
    <script src="scene-data.js"></script>
    <script src="viewer.js"></script>
    <script src="../explorer.js"></script>
  </body>
</html>
